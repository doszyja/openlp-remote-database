services:
  languagetool:
    image: meyay/languagetool:latest
    container_name: openlp-languagetool-dev
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - openlp-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8081/v2/languages",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # MongoDB Database (only service running in Docker for development)
  mongodb:
    image: mongo:7
    container_name: openlp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-openlp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-openlp_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-openlp_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openlp-network

networks:
  openlp-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

